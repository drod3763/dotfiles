[package_catalog.packages."p7zip"]
os = "mac"
type = "common"
target_class = "all"
brew_formula_name = "p7zip"
when_tools = ["7z", "unrar"]

[shell_manifest.entries.p7zip-functions]
priority = 252

[shell_manifest.entries.p7zip-functions.rules]
when_tool = "7z"

[shell_manifest.entries.p7zip-functions.functions.ex]
kind = "literal"
value = """
ex()
{
  if ! command -v 7z >/dev/null 2>&1 || ! command -v unrar >/dev/null 2>&1 ; then
    echo "ex() requires both 7z and unrar"
    return 1
  fi

  if [ -f $1 ] ; then
    case $1 in
      *.tar.bz2)   tar xjf $1   ;;
      *.tar.gz)    tar xzf $1   ;;
      *.bz2)       bunzip2 $1   ;;
      *.rar)       unrar x $1   ;;
      *.gz)        gunzip $1    ;;
      *.tar)       tar xf $1    ;;
      *.tbz2)      tar xjf $1   ;;
      *.tgz)       tar xzf $1   ;;
      *.zip)       unzip $1     ;;
      *.Z)         uncompress $1;;
      *.7z)        7z x $1      ;;
      *.deb)       ar x $1      ;;
      *.tar.xz)    tar xf $1    ;;
      *.tar.zst)   unzstd $1    ;;
      *)           echo "'$1' cannot be extracted via ex()" ;;
    esac
  else
    echo "'$1' is not a valid file"
  fi
}
"""
