[package_catalog.packages."node"]
os = "mac"
type = "common"
target_class = "all"
use_mise = true
mise_tool_name = "node@20"

[package_catalog.packages."node-tooling"]
os = "common"
type = "common"
target_class = "all"
when_any_tools = ["node", "npm", "pnpm", "yarn"]

[shell_manifest.entries.node-tooling]
priority = 245

[shell_manifest.entries.node-tooling.rules]
when_tools_any = ["node", "npm", "pnpm", "yarn"]

[shell_manifest.entries.node-tooling.exports.NPM_CONFIG_USERCONFIG]
kind = "literal"
value = "${XDG_CONFIG_HOME}/npm/npmrc"
