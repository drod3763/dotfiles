[shell_manifest.entries.core-utils-any]
priority = 100

[shell_manifest.entries.core-utils-any.aliases.sudo]
kind = "literal"
value = "sudo "

[shell_manifest.entries.core-utils-any.aliases.tailcat]
kind = "literal"
value = "tail --lines=+0"

[shell_manifest.entries.core-utils-any.aliases.wtfport]
kind = "literal"
value = "lsof -i -P -n | grep LISTEN"

[shell_manifest.entries.core-utils-any.aliases.secretscan]
kind = "literal"
value = "${DOTFILES}/scripts/check_secrets.sh"

[shell_manifest.entries.core-functions]
priority = 50

[shell_manifest.entries.core-functions.functions.mkd]
kind = "literal"
value = '''
function mkd() {
    mkdir -p "$@" && cd "$_";
}
'''

[shell_manifest.entries.core-functions.functions.sha]
kind = "literal"
value = '''
function sha {
	openssl dgst -sha256 ${1} | cut -d ' ' -f2 # | tr -d '[:space:]'
}
'''

[shell_manifest.entries.core-functions.functions.md5]
kind = "literal"
value = '''
function md5 {
	openssl dgst -md5 ${1} | cut -d ' ' -f2 # | tr -d '[:space:]'
}
'''

[shell_manifest.entries.core-functions.functions.comp]
kind = "literal"
value = '''
function comp {
    STRING1=${1}
    STRING2=${2}

	if [ "$STRING1" = "$STRING2" ] ; then
		echo "match"
	else
		echo "no match"
	fi
}
'''

[shell_manifest.entries.core-functions.functions.shacomp]
kind = "literal"
value = '''
shacomp() {
	comp "$(sha "${1}")" "$(sha "${2}")"
}
'''

[shell_manifest.entries.core-functions.functions.b64enc]
kind = "literal"
value = '''
function b64enc {
	openssl base64 -in "${1}" > "${1}.b64"
}
'''

[shell_manifest.entries.core-functions.functions.ldf]
kind = "literal"
value = '''
ldf() {
  local file=~/Downloads/$(\ls -1t ~/Downloads/ | head -n1)
  read -p "confirm: $file "
  mv "$file" .
}
'''

[shell_manifest.entries.core-functions.functions.tad]
kind = "literal"
value = '''
tad() {
  local ts=$(date +%s)
  local d="$HOME/.throw-away/$ts"
  mkdir -p $d
  (cd $d; bash)
  rm -r $d
}
'''

[shell_manifest.entries.core-functions.functions.listusers]
kind = "literal"
value = '''
function listusers () {
	dscl . list /Users | grep -v ^_.*
}
'''

[shell_manifest.entries.core-functions.functions.detect_os]
kind = "literal"
value = '''
function detect_os() {
    if [ "$FORCE_OS" ]; then
        echo "$FORCE_OS"; return 0
    fi
    case $(uname -s) in
    Linux)
        case $(uname -o) in
        GNU/Linux)
            if grep -q -e '^EdgeRouter' -e '^UniFiSecurityGateway' /etc/version 2> /dev/null; then
                echo "edgeos"; return 0
            fi
            if uname -u 2>/dev/null | grep -q '^synology'; then
                echo "synology"; return 0
            fi
            # shellcheck disable=SC1091
            dist=$(. /etc/os-release; echo "$ID")
            case $dist in
            debian|ubuntu|elementary|raspbian|centos|fedora|rhel|arch|manjaro|openwrt|clear-linux-os|linuxmint|opensuse-tumbleweed|opensuse|solus|pop)
                echo "$dist"; return 0
                ;;
            esac
            ;;
        ASUSWRT-Merlin*)
            echo "asuswrt-merlin"; return 0
            ;;
        DD-WRT)
            echo "ddwrt"; return 0
        esac
        ;;
    Darwin)
        echo "darwin"; return 0
        ;;
    FreeBSD)
        if [ -f /etc/platform ]; then
            case $(cat /etc/platform) in
            pfSense)
                echo "pfsense"; return 0
                ;;
            esac
        fi
        if [ -x /usr/local/sbin/opnsense-version ]; then
            case $(/usr/local/sbin/opnsense-version -N) in
            OPNsense)
                echo "opnsense"; return 0
                ;;
            esac
        fi
        echo "freebsd"; return 0
        ;;
    NetBSD)
        echo "netbsd"; return 0
        ;;
    OpenBSD)
        echo "openbsd"; return 0
        ;;
    *)
    esac
    log_error "Unsupported OS: $(uname -s)"
    return 1
}
'''

[shell_manifest.entries.core-functions.functions.cd_]
kind = "literal"
value = '''
cd_() {
  local p=$PWD
  while [ $p != "/" ]; do
    if [ -d "$p/.git" ]; then
      cd "$p"
      break
    fi
    p=${p:h}
  done
}
'''

[shell_manifest.entries.core-functions.functions.cd]
kind = "literal"
value = '''
cd() {
  local dest="${@:-"$HOME"}"
  if [ "$dest" = "_" ]; then
    cd_ "$dest"
    return
  fi
  if [ -f "$dest" ]; then
    dest=${dest:h}
  fi
  builtin cd "$dest"
}
'''
