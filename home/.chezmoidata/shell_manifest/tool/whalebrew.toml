[package_catalog.packages."whalebrew"]
os = "common"
type = "common"
target_class = "all"
when_tool = "whalebrew"

[shell_manifest.entries.whalebrew]
priority = 252

[shell_manifest.entries.whalebrew.rules]
when_os = ["darwin"]
when_tool = "whalebrew"

[shell_manifest.entries.whalebrew.exports.WHALEBREW_CONFIG_DIR]
kind = "literal"
value = "${XDG_CONFIG_HOME}/whalebrew"
