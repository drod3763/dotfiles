[package_catalog.packages."zsh-autosuggestions"]
os = "mac"
type = "common"
target_class = "all"
brew_formula_name = "zsh-autosuggestions"

# Fish-style autosuggestions. Load after fzf-tab, before syntax-highlighting.
[shell_manifest.entries.zsh-autosuggestions]
priority = 360

[shell_manifest.entries.zsh-autosuggestions.rules]
when_shell = ["zsh"]

[shell_manifest.entries.zsh-autosuggestions.init.zsh-autosuggestions]
kind = "literal"
value = '''
# Right-arrow (forward-char) accepts one character; Ctrl+E accepts the whole
# suggestion (z4h-equivalent partial-accept behavior). Set before sourcing.
ZSH_AUTOSUGGEST_ACCEPT_WIDGETS=(end-of-line vi-end-of-line vi-add-eol)
ZSH_AUTOSUGGEST_PARTIAL_ACCEPT_WIDGETS=(
  forward-char vi-forward-char
  forward-word emacs-forward-word vi-forward-word vi-forward-word-end
  vi-forward-blank-word vi-forward-blank-word-end
  vi-find-next-char vi-find-next-char-skip
)
[[ -r "$HOMEBREW_PREFIX/share/zsh-autosuggestions/zsh-autosuggestions.zsh" ]] &&
  source "$HOMEBREW_PREFIX/share/zsh-autosuggestions/zsh-autosuggestions.zsh"
'''
