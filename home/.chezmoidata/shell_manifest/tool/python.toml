[package_catalog.packages."python"]
os = "mac"
type = "work"
target_class = "all"
use_mise = true
mise_tool_name = "python"
when_any_tools = ["pip", "pip3"]

[shell_manifest.entries.python-env]
priority = 255

[shell_manifest.entries.python-env.rules]
when_os = ["darwin", "linux"]
when_tools_any = ["python3", "python"]

[shell_manifest.entries.python-env.exports.PYTHONPYCACHEPREFIX]
kind = "literal"
value = "${XDG_CACHE_HOME}/python"

[shell_manifest.entries.python-env.exports.PYTHON_HOMES]
kind = "literal"
value = "(${HOME}/Library/Python/*)"

[shell_manifest.entries.python-env.exports.PYTHON_HOME]
kind = "literal"
value = "${PYTHON_HOMES}[0]"

[shell_manifest.entries.python-env.exports.PYTHONPATH]
kind = "literal"
value = "${HOME}/.python"

[shell_manifest.entries.python-env.exports.PYTHONUSERBASE]
kind = "literal"
value = "${XDG_DATA_HOME}/python"

[shell_manifest.entries.python-pipu]
priority = 245

[shell_manifest.entries.python-pipu.rules]
when_tools_any = ["pip", "pip3"]

[shell_manifest.entries.python-pipu.functions.pipu]
kind = "literal"
value = """
function pipu() {
  local pip_cmd=\"pip\"
  if command -v pip3 >/dev/null 2>&1; then
    pip_cmd=\"pip3\"
  elif command -v pip >/dev/null 2>&1; then
    pip_cmd=\"pip\"
  else
    echo \"pip/pip3 not found\" >&2
    return 1
  fi

  \"${pip_cmd}\" list --outdated --format=freeze | grep -v '^\\-e' | cut -d = -f 1 | xargs -n1 \"${pip_cmd}\" install -U --user
}
"""
