[package_catalog.packages."ripgrep"]
os = "mac"
type = "common"
target_class = "all"
brew_formula_name = "ripgrep"

[shell_manifest.entries.ripgrep]
priority = 248

[shell_manifest.entries.ripgrep.rules]
when_tool = "rg"

[shell_manifest.entries.ripgrep.exports.RIPGREP_CONFIG_PATH]
kind = "literal"
value = "${XDG_CONFIG_HOME}/ripgrep/config"
