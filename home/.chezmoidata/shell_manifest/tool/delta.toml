[package_catalog.packages."delta"]
os = "mac"
type = "common"
target_class = "all"
brew_formula_name = "drod3763/tap/git-delta-fork"

[shell_manifest.entries.delta]
priority = 256

[shell_manifest.entries.delta.rules]
when_os = ["linux"]
when_tool = "delta"

[shell_manifest.entries.delta.exports.DIFFPROG]
kind = "literal"
value = "delta --dark --line-numbers --side-by-side --no-gitconfig"
