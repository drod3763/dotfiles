[package_catalog.packages."git"]
os = "mac"
type = "common"
target_class = "all"
brew_formula_name = "git"

[shell_manifest.entries.git-diff-untracked]
priority = 300

[shell_manifest.entries.git-diff-untracked.rules]
when_tool = "tuicr"

[shell_manifest.entries.git-diff-untracked.functions.gd]
kind = "literal"
value = """
gd() {
  git add --intent-to-add :/ >/dev/null 2>&1
  tuicr -w "$@"
}
"""
