[package_catalog.packages."claude-code@latest"]
os = "mac"
type = "common"
target_class = "all"
brew_cask_name = "claude-code@latest"
config_file_locations = [".claude", ".config/claude"]

[shell_manifest.entries.claude-code]
priority = 235

[shell_manifest.entries.claude-code.rules]
when_tools_any = ["claude", "claude-code"]

[shell_manifest.entries.claude-code.functions.claudebr]
kind = "literal"
value = """
claudebr() {
  local aws_region account_id opus_model haiku_model sonnet_model
  aws_region="${AWS_REGION:-us-west-2}"

  if ! command -v aws >/dev/null 2>&1; then
    echo "claudebr: aws CLI is required to resolve Bedrock account id" >&2
    return 1
  fi

  account_id="$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)"
  if [[ -z "${account_id:-}" || "${account_id}" == "None" ]]; then
    echo "claudebr: unable to resolve AWS account id via sts get-caller-identity" >&2
    return 1
  fi

  opus_model="arn:aws:bedrock:${aws_region}:${account_id}:inference-profile/us.anthropic.claude-opus-4-6-v1"
  haiku_model="arn:aws:bedrock:${aws_region}:${account_id}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1"
  sonnet_model="arn:aws:bedrock:${aws_region}:${account_id}:inference-profile/us.anthropic.claude-sonnet-4-6"

  CLAUDE_CODE_USE_BEDROCK=1 \
    ANTHROPIC_DEFAULT_OPUS_MODEL="${opus_model}" \
    ANTHROPIC_DEFAULT_HAIKU_MODEL="${haiku_model}" \
    ANTHROPIC_DEFAULT_SONNET_MODEL="${sonnet_model}" \
    command claude "$@"
}
"""

[shell_manifest.entries.claude-code.exports.CLAUDE_CONFIG_DIR]
kind = "literal"
value = "${XDG_CONFIG_HOME}/claude"

[shell_manifest.entries.claude-code.exports.CLAUDE_CODE_NO_FLICKER]
kind = "literal"
value = "1"
