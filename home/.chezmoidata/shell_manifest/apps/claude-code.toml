[package_catalog.packages."claude-code"]
os = "mac"
type = "common"
target_class = "all"
brew_cask_name = "claude-code"
config_file_locations = [".claude", ".config/claude"]

[shell_manifest.entries.bedrock-models]
priority = 236

[shell_manifest.entries.bedrock-models.rules]
when_personal = "false"
when_tool = "claude"

[shell_manifest.entries.claude-code]
priority = 235

[shell_manifest.entries.claude-code.rules]
when_tool = "claude"

[shell_manifest.entries.claude-code.aliases.claudebr]
kind = "literal"
value = "CLAUDE_CODE_USE_BEDROCK=1 command claude"

[shell_manifest.entries.claude-code.exports.CLAUDE_CONFIG_DIR]
kind = "literal"
value = "${XDG_CONFIG_HOME}/claude"

[shell_manifest.entries.bedrock-models.exports.ANTHROPIC_DEFAULT_OPUS_MODEL]
kind = "dynamic"
resolver = "anthropic_model"
omit_if_empty = true

[shell_manifest.entries.bedrock-models.exports.ANTHROPIC_DEFAULT_HAIKU_MODEL]
kind = "dynamic"
resolver = "anthropic_small_fast_model"
omit_if_empty = true

[shell_manifest.entries.bedrock-models.exports.ANTHROPIC_DEFAULT_SONNET_MODEL]
kind = "dynamic"
resolver = "anthropic_default_sonnet_model"
omit_if_empty = true
