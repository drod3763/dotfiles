[shell_manifest.entries.base]
priority = 100

[shell_manifest.entries.base.rules]
when_personal = "any"
when_transient = "any"

[shell_manifest.entries.base.exports.EDITOR]
kind = "literal"
value = "vi"

[shell_manifest.entries.base.exports.DOTFILES]
kind = "dynamic"
resolver = "source_dir"

[shell_manifest.entries.base.exports.GPG_TTY]
kind = "literal"
value = "$TTY"

[shell_manifest.entries.base.exports.INPUTRC]
kind = "literal"
value = "${XDG_CONFIG_HOME}/readline/inputrc"

[shell_manifest.entries.base.exports.LESSHISTFILE]
kind = "literal"
value = "${XDG_CACHE_HOME}/less/history"
