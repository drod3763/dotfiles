[shell_manifest.entries.imagemagick-functions]
priority = 251

[shell_manifest.entries.imagemagick-functions.rules]
when_tools_any = ["convert", "magick"]

[shell_manifest.entries.imagemagick-functions.functions.fakeScan]
kind = "literal"
value = """
function fakeScan() {
  local img_cmd="convert"
  if command -v magick >/dev/null 2>&1; then
    img_cmd="magick"
  fi

  ${img_cmd} -density 90 ${1} -rotate 0.5 -attenuate 0.2 +noise Multiplicative -colorspace Gray scan_${1}
}
"""
