]

[packages.macos.rules.mas]
"Amphetamine" = ", id: 937984704"
"Xcode" = ", id: 497799835"

[[packages.macos.rules]]
id = "openin-helper"
when_stat = "/Applications/OpenIn.app"
casks = ["openin-helper"]

[[packages.macos.rules]]
id = "not-transient"
when_not_transient = true
casks = ["parallels"]

[[packages.macos.config_paths]]
id = "onepassword"
casks = ["1password"]
paths = [".config/1Password"]

[[packages.macos.config_paths]]
id = "alfred"
