  "mouseless",
  "ricoh-theta",
  "sensei",
  "soundsource",
  "soulver",
  "swish",
  "windscribe",
]

[[packages.macos.rules]]
id = "work"
when_not_personal = true
taps = ["drod3763/tap", "felixkratz/formulae", "oven-sh/bun"]
brews = [
  "act",
  "actionlint",
  "awscli",
  "azure-cli",
  "caddy",
  "docker-compose",
  "docker-credential-helper-ecr",
  "dotnet@8",
  "fx",
  "helm",
  "kubectx",
  "kubernetes-cli",
  "lastpass-cli",
  "mise",
  "pulumi",
  "python",
  "rar",
  "saml2aws",
  "tilt",
  "yq",
]
