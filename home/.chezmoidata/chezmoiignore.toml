[chezmoiignore]
base = [
  "*.deb",
  "*.tar.gz",
  "1password_settings.json",
  "functions",
  "key.txt.age",
  "install.sh",
  "Makefile",
  "README.md",
  "treefmt.toml",
  "vscode_settings.json",
]

not_darwin = [
  ".AzureToolsForIntelliJ",
  ".CFUserTextEncoding",
  ".DS_Store",
  ".IdentityService",
  ".Trash",
  ".chezmoiscripts/darwin/**",
]

not_linux = [
  ".chezmoiscripts/linux/**",
  ".config/paru",
  ".config/kitty",
  "1password_settings.json",
]

non_zsh_shell = [".p10k.zsh", ".zshenv", ".zshrc"]

non_bash_shell = [".bashrc", ".bash_profile"]

not_windows = [
  ".chezmoiscripts/windows/**",
  # Windows-only ~/.claude; macOS/Linux use ~/.config/claude.
  ".claude",
  ".claude/**",
  "AppData",
  "Documents",
]

# Windows is opt-in: everything is ignored unless re-included with "!" below,
# so macOS/Linux files never leak onto a Windows machine.
windows = [
  "**",
  "!.chezmoiscripts/windows/**",
  "!AppData",
  "!AppData/Local",
  "!AppData/Local/1Password",
  "!AppData/Local/1Password/config",
  "!AppData/Local/1Password/config/ssh",
  "!AppData/Local/1Password/config/ssh/agent.toml",
  "!.claude",
  "!.claude/settings.json",
  "!.claude/plugins",
  "!.claude/plugins/known_marketplaces.json",
  "!.claude/plugins/marketplaces",
  "!.claude/plugins/marketplaces/*",
  "!.ssh",
  "!.ssh/config",
  "!.config",
  "!.config/git",
  "!.config/git/config",
  "!.config/git/ignore",
  "!Documents",
  "!Documents/PowerShell/**",
  "!Documents/WindowsPowerShell/**",
]
