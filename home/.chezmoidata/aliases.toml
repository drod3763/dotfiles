[aliases.common]
clear = "z4h-clear-screen-soft-bottom"
secretscan = "${DOTFILES}/scripts/check_secrets.sh"
sudo = "sudo "
tailcat = "tail --lines=+0"
wtfport = "lsof -i -P -n | grep LISTEN"

[[aliases.rules]]
id = "bash-nav"
when_shell = "bash"
[aliases.rules.values]
"-- -" = "cd -"
".." = "cd .."
"..2" = "..; .."
"..3" = "..2; .."
"..4" = "..3; .."
"..5" = "..4; .."

[[aliases.rules]]
id = "ssh"
when_tool = "ssh"
[aliases.rules.values]
sshrm = "ssh keygen -R"

[[aliases.rules]]
id = "darwin-brew"
when_os = "darwin"
when_tool = "brew"
[aliases.rules.values]
bls = "brew leaves --installed-on-request"
brewup = "brew update && brew upgrade && brew upgrade --cask && brew cleanup"
bcu = "brew update && brew upgrade --cask --greedy && brew cleanup"

[[aliases.rules]]
id = "darwin-work-zap"
when_os = "darwin"
when_not_personal = true
[aliases.rules.values]
zapfix = "sudo launchctl load -w /Library/LaunchDaemons/com.zscaler.service.plist"

[[aliases.rules]]
id = "linux-bcompare"
when_os = "linux"
when_tool = "bcompare"
[aliases.rules.values]
pdiff = "QT_GRAPHICSSYSTEM=native DIFFPROG=bcompare pacdiff"
