[shell_manifest.entries.bedrock-models]
priority = 236

[shell_manifest.entries.bedrock-models.rules]
when_personal = "false"
when_tool = "claude"

[shell_manifest.entries.bedrock-models.exports.ANTHROPIC_MODEL]
kind = "dynamic"
resolver = "anthropic_model"
omit_if_empty = true

[shell_manifest.entries.bedrock-models.exports.ANTHROPIC_SMALL_FAST_MODEL]
kind = "dynamic"
resolver = "anthropic_small_fast_model"
omit_if_empty = true
