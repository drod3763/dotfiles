# The formatter multiplexer - https://github.com/numtide/treefmt

# Do not exit with error if a configured formatter is missing
# Env $TREEFMT_ALLOW_MISSING_FORMATTER
# allow-missing-formatter = true

# The file into which a cpu profile will be written
# Env $TREEFMT_CPU_PROFILE
# cpu-profile = ./cpu.pprof

# Exclude files or directories matching the specified globs
# Env $TREEFMT_EXCLUDES
excludes = [
  ".git/**",
  "tmp/**",
  "home/private_dot_config/hammerspoon/Spoons/**",
  "**/*.age",
]

# Exit with error if any changes were made during execution
# Useful for CI
# Env $TREEFMT_FAIL_ON_CHANGE
# fail-on-change = true

# A list of formatters to apply
# Defaults to all configured formatters
# Env $TREEFMT_FORMATTERS
# formatters = ["gofmt", "prettier"]

# Log paths that did not match any formatters at the specified log level
# Possible values are <debug|info|warn|error|fatal>
# Env $TREEFMT_ON_UNMATCHED
# on-unmatched = "info"

# The root directory from which treefmt will start walking the filesystem
# Defaults to the directory containing the config file
# Env $TREEFMT_TREE_ROOT
# tree-root = "/tmp/foo"

# File to search for to find the tree root (if tree-root is not set)
# Env $TREEFMT_TREE_ROOT_FILE
# tree-root-file = ".git/config"

# Set the verbosity of logs
# 0 = warn, 1 = info, 2 = debug
# Env $TREEFMT_VERBOSE
# verbose = 2

# The method used to traverse the files within the tree root
# Currently, we support 'auto', 'git' or 'filesystem'
# Env $TREEFMT_WALK
# walk = "filesystem"

[formatter.nix]
command = "nixpkgs-fmt"
includes = ["*.nix"]

[formatter.toml]
command = "taplo"
includes = ["*.toml"]
options = ["format"]

[formatter.prettier]
command = "bunx"
includes = ["*.json", "*.jsonc", "*.md", "*.mdc", "*.yaml", "*.yml"]
options = ["prettier", "--write"]

[formatter.go-template]
command = "bunx"
excludes = [
  "home/private_dot_config/git/config.tmpl",
  # Render-only shell templates: prettier reflows shell runs as prose and breaks
  # the rendered output. Keep them out of the go-template formatter.
  "home/private_dot_config/zsh/dot_zshrc.tmpl",
  "home/.chezmoitemplates/bindkeys.tmpl",
  # TOML-producing templates: prettier has no TOML parser and reflows the body
  # into invalid output. Handled by [formatter.toml-template] instead.
  "*.toml.tmpl",
  # JSON-producing template: prettier's go-template parser cannot handle the
  # interpolated values (e.g. {{ ... | toPrettyJson }} in value position) and
  # reflows the whole document into an unreadable blob. Hand-maintained.
  "home/private_dot_config/claude/settings.json.tmpl",
]
includes = ["*.tmpl"]
options = [
  "prettier",
  "--plugin",
  "prettier-plugin-go-template",
  "--parser",
  "go-template",
  "--write",
]

# Two-step formatter for TOML-producing templates: normalizes Go expressions,
# then renders the template and applies `taplo` whitespace back onto the static
# TOML lines (see scripts/format_toml_template.js). Skips files that cannot
# render here. `.chezmoi.toml.tmpl` is bootstrap config with intentional
# nested-action indentation and never renders via execute-template, so it is
# hand-maintained (excluded from both template formatters).
[formatter.toml-template]
command = "bun"
excludes = ["home/.chezmoi.toml.tmpl"]
includes = ["*.toml.tmpl"]
options = ["scripts/format_toml_template.js"]

# NOTE: home/private_dot_config/claude/hooks/executable_herdr-agent-state.sh is a
# third-party hook script written and overwritten by `herdr integration install`.
# It is excluded from shfmt/shellcheck below so it stays byte-identical to herdr's
# shipped version (re-capturing after a herdr upgrade remains a clean copy).
[formatter.shfmt]
command = "shfmt"
excludes = [
  "home/private_dot_config/claude/hooks/executable_herdr-agent-state.sh",
]
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]
options = ["-s", "-w", "-i", "2"]

[formatter.shellcheck]
command = "shellcheck"
excludes = [
  "home/private_dot_config/claude/hooks/executable_herdr-agent-state.sh",
]
includes = ["*.sh", "*.bash", "*.envrc", "*.envrc.*"]
options = []
